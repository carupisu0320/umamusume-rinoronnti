name: マスターデータ更新リマインダー

# 毎月1日と15日にIssueを自動作成し、シナリオ・因子データが
# 最新か確認するよう促す。外部サイトの自動スクレイピングは行わず、
# 「確認のきっかけ」を作るだけに留めている（利用規約への配慮）。
on:
  schedule:
    - cron: "0 0 1,15 * *"
  workflow_dispatch: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: 現在登録中のシナリオを読む
        id: current
        run: echo "scenario=$(cat data/current_scenario.txt)" >> "$GITHUB_OUTPUT"

      - name: Issueを作成
        uses: actions/github-script@v7
        with:
          script: |
            const scenario = `${{ steps.current.outputs.scenario }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `マスターデータ更新確認 (${new Date().toISOString().slice(0,10)})`,
              body: [
                "定期リマインダーです。",
                "",
                `現在登録されているシナリオ: **${scenario}**`,
                "",
                "以下を確認してください：",
                "- 育成シナリオが切り替わっていないか（新シナリオ実装のお知らせなど）",
                "- サポカ・因子の新規追加や上方修正がないか",
                "",
                "更新がある場合は、アプリの「05 因子・シナリオのマスターデータ」セクションから",
                "JSONを編集して反映し、`data/current_scenario.txt` も更新してください。",
                "",
                "（このIssueは自動生成です。外部サイトの自動取得は行っていません。）"
              ].join("\n"),
              labels: ["data-update"]
            });
